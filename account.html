<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — AJKER FASHION</title><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script><script defer src="js/data.js"></script><script defer src="js/app.js"></script><script defer src="js/auth.js"></script></head><body><div id="site-header"></div><main class="container section" id="account-content"></main><div id="site-footer"></div><div id="toast" class="toast"></div><script>document.addEventListener('DOMContentLoaded',()=>{if(!requireUser())return;const u=currentUser(),orders=JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)||'[]').filter(x=>x.customerId===u.id);document.getElementById('account-content').innerHTML=`<p class="eyebrow">MY ACCOUNT</p><h1>স্বাগতম, ${esc(u.name)}</h1><p>${esc(u.email)}</p><div class="admin-nav"><a class="btn btn-light" href="wishlist.html">Wishlist</a><button class="btn btn-dark" data-logout>Logout</button></div><h2>আমার Orders</h2>${orders.length?orders.map(o=>`<div class="notice"><strong>${o.orderNumber}</strong><br>${formatCurrency(o.total)} · ${o.orderStatus}</div>`).join(''):'<div class="empty">এখনো কোনো order নেই। <a href="shop.html">Shop করুন</a></div>`;document.querySelector('[data-logout]').onclick=()=>{localStorage.removeItem(STORAGE_KEYS.currentUser);location.href='index.html'}});</script></body></html>
