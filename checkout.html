<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — AJKER FASHION</title><meta name="description" content="নিরাপদে order সম্পন্ন করুন"><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script><script defer src="js/data.js"></script><script defer src="js/app.js"></script><script defer src="js/cart.js"></script><script defer src="js/checkout.js"></script></head><body><div id="site-header"></div><main class="container section"><div class="checkout-layout"><section><p class="eyebrow">CHECKOUT</p><h1>আপনার তথ্য দিন</h1><form id="checkout-form" class="form-grid" novalidate><div class="field"><label for="name">পূর্ণ নাম *</label><input id="name" required><small class="error"></small></div><div class="field"><label for="phone">মোবাইল নম্বর *</label><input id="phone" placeholder="01XXXXXXXXX" required><small class="error"></small></div><div class="field"><label for="email">ইমেইল</label><input id="email" type="email"><small class="error"></small></div><div class="field"><label for="division">বিভাগ</label><input id="division"></div><div class="field"><label for="district">জেলা</label><input id="district"></div><div class="field"><label for="upazila">উপজেলা</label><input id="upazila"></div><div class="field full"><label for="address">পূর্ণ ঠিকানা *</label><textarea id="address" rows="4" required></textarea><small class="error"></small></div><div class="field full"><label>Payment</label><label><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label><label><input type="radio" disabled> Online payment — শীঘ্রই আসছে</label></div><button class="btn btn-dark" type="submit">অর্ডার নিশ্চিত করুন</button></form></section><aside class="summary"><h2>Order Summary</h2><div id="checkout-summary"></div></aside></div></main><div id="site-footer"></div><div id="toast" class="toast" role="status"></div></body></html>
