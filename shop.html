<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — AJKER FASHION</title><meta name="description" content="Ajker Fashion-এর সব fashion products দেখুন"><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script><script defer src="js/data.js"></script><script defer src="js/app.js"></script><script defer src="js/shop.js"></script></head><body data-page="shop"><div id="site-header"></div><main><section class="page-head"><div class="container"><p class="eyebrow">THE COLLECTION</p><h1 id="shop-title">Shop</h1></div></section><div class="container shop-layout"><aside class="filters"><h3>Filter Products</h3><div class="filter-group"><h3>Category</h3><label class="check"><input type="checkbox" value="men" data-category> Men</label><label class="check"><input type="checkbox" value="women" data-category> Women</label><label class="check"><input type="checkbox" value="kids" data-category> Kids</label><label class="check"><input type="checkbox" value="shoes" data-category> Shoes</label><label class="check"><input type="checkbox" value="bags" data-category> Bags</label><label class="check"><input type="checkbox" value="accessories" data-category> Accessories</label></div><div class="filter-group"><h3>Minimum Rating</h3><select id="rating-filter"><option value="0">সব rating</option><option value="4">৪+ stars</option><option value="4.5">৪.৫+ stars</option></select></div></aside><section><div class="shop-tools"><input class="search-input" id="product-search" placeholder="পণ্য খুঁজুন..." autocomplete="off"><select id="sort-products"><option value="featured">Featured</option><option value="newest">Newest</option><option value="low">Price Low to High</option><option value="high">Price High to Low</option><option value="rating">Best Rated</option><option value="discount">Best Discount</option></select></div><div id="shop-results" class="product-grid"></div></section></div></main><div id="site-footer"></div><div id="toast" class="toast" role="status"></div></body></html>
