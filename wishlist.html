<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist — AJKER FASHION</title><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script><script defer src="js/data.js"></script><script defer src="js/app.js"></script></head><body><div id="site-header"></div><main class="container section"><p class="eyebrow">SAVED ITEMS</p><h1>আমার Wishlist</h1><div id="wishlist-grid" class="product-grid"></div></main><div id="site-footer"></div><div id="toast" class="toast"></div><script>document.addEventListener('DOMContentLoaded',()=>{const ids=getWishlist(),a=getAllProducts().filter(p=>ids.includes(p.id));document.getElementById('wishlist-grid').innerHTML=a.length?a.map(productCard).join(''):'<div class="empty">আপনার wishlist এখনো খালি। <a href="shop.html">Shop করুন</a></div>'})</script></body></html>
