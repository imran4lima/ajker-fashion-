<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — AJKER FASHION</title><meta name="description" content="Ajker Fashion product details"><link rel="stylesheet" href="css/style.css"><script defer src="js/config.js"></script><script defer src="js/data.js"></script><script defer src="js/app.js"></script></head><body data-page="product"><div id="site-header"></div><main class="container"><div id="product-detail"></div></main><div id="site-footer"></div><div id="toast" class="toast" role="status"></div><script>document.addEventListener('DOMContentLoaded',()=>{const slug=new URLSearchParams(location.search).get('slug'),p=getAllProducts().find(x=>x.slug===slug)||getAllProducts()[0],root=document.getElementById('product-detail');let size='',color='',qty=1;document.title=p.name+' — AJKER FASHION';root.innerHTML=`<section class="product-detail"><div><div class="gallery-main"><img id="main-photo" src="${p.images[0]}" alt="${esc(p.name)}"></div><div class="thumbs">${p.images.map(i=>`<img src="${i}" alt="${esc(p.name)} thumbnail">`).join('')}</div></div><div class="detail"><p class="eyebrow">${p.brand} / ${p.subcategory}</p><h1>${esc(p.name)}</h1><p>★ ${p.rating} (${p.reviewCount} reviews)</p><p class="price">${formatCurrency(p.price)} <del class="old-price">${formatCurrency(p.compareAtPrice)}</del></p><p>${esc(p.description)}</p><div class="choice"><strong>Color</strong><div id="colors">${p.colors.map(x=>`<button data-color="${x}">${x}</button>`).join('')}</div></div><div class="choice"><strong>Size</strong><div id="sizes">${p.sizes.length?p.sizes.map(x=>`<button data-size="${x}">${x}</button>`).join(''):'<span>এই পণ্যে size প্রযোজ্য নয়</span>'}</div></div><p>স্টক: <strong>${p.stock>0?'Available':'Out of stock'}</strong></p><div class="qty"><button id="minus">−</button><input id="quantity" value="1" readonly><button id="plus">+</button></div><div class="detail-actions"><button class="btn btn-dark" id="add">কার্টে যোগ করুন</button><button class="btn btn-light" id="buy">এখনই কিনুন</button><button class="heart" data-wish="${p.id}">♡</button></div><div class="info-box"><strong>Shipping & Returns</strong><p>ঢাকার ভিতরে ৳60, বাইরে ৳120 delivery। ৭ দিনের মধ্যে সহজ return সুবিধা।</p></div></div></section><section class="section"><h2>Customer Reviews</h2><div class="notice">এই পণ্যের verified customer reviews শীঘ্রই যোগ হবে।</div></section><section class="section"><h2>Related Products</h2><div class="product-grid">${getAllProducts().filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4).map(productCard).join('')}</div></section>`;root.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;root.querySelectorAll('[data-color]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});root.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;root.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});root.querySelector('#minus').onclick=()=>{qty=Math.max(1,qty-1);root.querySelector('#quantity').value=qty};root.querySelector('#plus').onclick=()=>{qty=Math.min(p.stock,qty+1);root.querySelector('#quantity').value=qty};root.querySelector('#add').onclick=()=>addToCart(p.id,{size,color,quantity:qty});root.querySelector('#buy').onclick=()=>{addToCart(p.id,{size,color,quantity:qty});location.href='cart.html'};root.querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>root.querySelector('#main-photo').src=t.src)});</script></body></html>
